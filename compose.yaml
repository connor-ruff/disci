# Local development services. See docs/project_plans/disci-infrastructure.md §3d.
# Credentials here are for the local database only and are not secret.

name: disci

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: disci
      POSTGRES_PASSWORD: disci
      POSTGRES_DB: disci
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disci -d disci"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Migration runner. Not started by `docker compose up`; invoked via the Makefile.
  dbmate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://disci:disci@db:5432/disci?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_SCHEMA_FILE: /db/schema.sql
    volumes:
      - ./db:/db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    name: disci-pgdata
